name: macos-macports-wheels-build
on:
  push:
  pull_request:
  # run automatically every three days to keep macports cache
  schedule:
    - cron: 0 0 */3 * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  talipot-abi3:
    name: Talipot wheel build for Python ${{ matrix.python-version }}
      on ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: macos-26-intel
            arch: x86_64
          - os: macos-15
            arch: arm64

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX11.3.sdk
      TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
      python-version: "3.11"

    steps:
      - name: Checkout Talipot code
        uses: actions/checkout@v7
      - name: Install Python ${{ env.python-version }}
        uses: actions/setup-python@v6
        id: python-install
        with:
          python-version: ${{ env.python-version }}
      - name: Install build and twine Python packages
        run: |
          which python
          python --version
          sudo pip install twine build sip
      # sudo is required to restore macports cache, apply same workaround from
      # https://github.com/actions/cache/issues/629#issuecomment-1189184648
      - name: Install gtar wrapper
        run: |
          gtar_path=$(which gtar)
          echo "#!/bin/sh" > gtar
          echo "exec sudo $gtar_path.orig \"\$@\"" >> gtar
          sudo mv $gtar_path $gtar_path.orig
          sudo mv gtar $gtar_path
          sudo chmod +x $gtar_path
      - name: Restore macports cache
        id: restore-macports-cache
        uses: actions/cache/restore@v6
        with:
          path: macports_software
          key: macports-cache-${{ matrix.config.arch }}-${{ matrix.config.os }}
          restore-keys: macports-cache-${{ matrix.config.arch }}-${{ matrix.config.os }}
      - name: Install MacPorts
        run: |
          curl -LO https://raw.githubusercontent.com/GiovanniBussi/macports-ci/master/macports-ci
          until source ./macports-ci install --sync=rsync; do sleep 1; done
      - name: Set macOS deployment target and install MacOSX sdk 11.3
        run: |
          echo 'macosx_deployment_target 11.0' | sudo tee -a /opt/local/etc/macports/macports.conf
          echo 'macosx_sdk_version 11.3' | sudo tee -a /opt/local/etc/macports/macports.conf
          curl -LO https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
          tar -xzf MacOSX11.3.sdk.tar.xz
          sudo mv MacOSX11.3.sdk /Library/Developer/CommandLineTools/SDKs/
      - name: Install Talipot build dependencies
        run: |
          if [ -d macports_software ]; then
            sudo cp macports_software/local-pubkey.pem /opt/local/share/macports/
            sudo mkdir -p /opt/local/var/macports/software/
            sudo cp -r macports_software/* /opt/local/var/macports/software/
            sudo rm -f /opt/local/var/macports/software/local-pubkey.pem
            echo /opt/local/share/macports/local-pubkey.pem | sudo tee -a /opt/local/etc/macports/pubkeys.conf
            echo "name macports_archive" | sudo tee -a /opt/local/etc/macports/archive_sites.conf
            echo "name local" | sudo tee -a /opt/local/etc/macports/archive_sites.conf
            echo "urls http://localhost:8000/" | sudo tee -a /opt/local/etc/macports/archive_sites.conf
            # fetch archives from localhost first
            echo "preferred_hosts localhost" | sudo tee -a /opt/local/etc/macports/macports.conf
            # start package archives HTTP server
            pushd macports_software
            echo "Starting local macports archives HTTP server ..."
            python3 -m http.server&
            # give HTTP server some time to start
            sleep 60
            popd
            # install package archives precompiled in a previous job run and put in cache
            for package in zlib expat libtool libssh2 pcre2 libiconv \
              libomp qhull yajl libgit2 openssl3 zstd cmake 
            do
              package_version=$(port info $package | head -1 | cut -f2 -d' ' | cut -c2-)
              if ls macports_software/$package/$package-$package_version*
              then
                sudo port -N install $package
              else
                sudo port -N -s install $package
              fi
            done
          else
            # install libraries that need to be bundled in wheel from source
            sudo port -N -s install cmake zlib \
              expat libtool libssh2 pcre2 libiconv \
              libomp qhull yajl libgit2 openssl3 zstd
          fi

          sudo port -N install flex bison pkgconfig
          git clone https://gitlab.com/graphviz/graphviz.git
          cd graphviz
          git checkout $(git describe --tags "$(git rev-list --tags --max-count=1)")
          mkdir build && cd build
          cmake -DCMAKE_PREFIX_PATH=/opt/local -DCMAKE_INSTALL_PREFIX=/opt/local ..
          make && sudo make install
          cd ../..

          # create archives to cache
          for package in $(ls /opt/local/var/macports/software/); do
            sudo port archive $package
          done

          # copy binary archives
          sudo rm -rf macports_software
          mkdir macports_software
          dest=$PWD/macports_software
          cd /opt/local/var/macports/software/
          sudo rsync -R **/*.tbz2 $dest
          cd -

          # sign binary archives
          openssl genrsa -out local-privkey.pem 2048
          openssl rsa -in local-privkey.pem -pubout -out local-pubkey.pem
          cp local-pubkey.pem macports_software
          for archive in $(find macports_software -name "*.tbz2"); do
            sudo openssl dgst -ripemd160 -sign local-privkey.pem -out $archive.rmd160 $archive
          done

      - name: Compute macports cache key
        id: cache-key
        run: |
          echo "value=$(sudo find macports_software | sha1sum | cut -c1-40)" >> $GITHUB_OUTPUT
        shell: bash
      - name: Save macports cache
        uses: actions/cache/save@v6
        with:
          path: macports_software
          key: macports-cache-${{ matrix.config.arch }}-${{ matrix.config.os }}-${{ steps.cache-key.outputs.value }}
      - name: Sets CIBW_BUILD and SDKROOT environment variable
        env:
          pyVer: "${{env.python-version}}"
          arch: "${{matrix.config.arch}}"
        run: |
          echo "CIBW_BUILD=cp${pyVer/./}-macosx_$arch" >> $GITHUB_ENV
          echo "SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX11.3.sdk" >> $GITHUB_ENV
      - name: Build talipot wheel abi3 with cibuildwheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_REPAIR_WHEEL_COMMAND: >
            pip install abi3audit &&
            abi3audit --strict --verbose {wheel} &&
            DYLD_LIBRARY_PATH=/opt/local/lib delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
        run: |
          SIP_ABI_VERSION=$(PYTHONPATH=$PWD/cmake python -c "import FindSIP; print(FindSIP.get_sip_abi_versions()[1])")
          sed -i '' -e "s/talipot-sip/talipot-sip\ \>=\ $SIP_ABI_VERSION/" pyproject.toml
          pip install cibuildwheel --user
          brew uninstall --ignore-dependencies zstd
          python -m cibuildwheel --output-dir wheelhouse

      - name: Test built wheel can be installed and imported
        working-directory: wheelhouse
        run: |
          pip install sip
          python -m sipbuild.tools.module --project talipot-sip --sdist talipot.sip
          pip install talipot_sip* && rm -f talipot_sip*

          pip install $(ls -t | head -1)
          python -c "from talipot import tlp; print(tlp.getLayoutAlgorithmPluginsList())"
          python -c "from talipot import tlp; print(tlp.getImportPluginsList())"
      - uses: actions/upload-artifact@v4
        with:
          name: talipot-wheel-abi3-${{ matrix.config.arch }}
          path: ./wheelhouse/*.whl
      - name: Publish talipot wheel to TestPyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          twine check wheelhouse/*
          twine upload --skip-existing wheelhouse/*

  talipot-sip:
    name: Talipot wheel build for Python ${{ matrix.python-version }}
      on ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    needs: [talipot-abi3]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        config:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64

    env:
      CLANG_VERSION: 20
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TWINE_REPOSITORY_URL: https://test.pypi.org/legacy/
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}

    steps:
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        id: python-install
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and twine Python packages
        run: |
          which python
          python --version
          sudo pip install twine build
      - name: Sets CIBW_BUILD environment variable
        env:
          pyVer: "${{matrix.python-version}}"
          arch: "${{matrix.config.arch}}"
        run: |
          echo "CIBW_BUILD=cp${pyVer/./}-macosx_$arch" >> $GITHUB_ENV
      - name: Build talipot-sip wheel with cibuildwheel
        env:
          CIBW_BUILD_VERBOSITY: 1
        run: |
          pip install cibuildwheel sip --user

          python -m sipbuild.tools.module --project talipot-sip --sdist talipot.sip
          tar -xvzf talipot_sip*.tar.gz && rm -f talipot_sip*.tar.gz
          cd talipot_sip*

          python -m cibuildwheel --output-dir ../wheelhouse
      - name: Download talipot abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: talipot-wheel-abi3-${{ matrix.config.arch }}
      - name: Test built wheel can be installed and imported
        working-directory: wheelhouse
        run: |
          pip install $(ls -t | head -1)
          cd .. && pip install talipot*.whl

          python -c "from talipot import tlp; print(tlp.getLayoutAlgorithmPluginsList())"
          python -c "from talipot import tlp; print(tlp.getImportPluginsList())"

          cd wheelhouse
          python -m sipbuild.tools.module --project talipot-sip --sdist talipot.sip
      - uses: actions/upload-artifact@v4
        with:
          name: talipot-wheel-${{ matrix.python-version }}-${{ matrix.config.arch }}
          path: ./wheelhouse/*.whl
      - name: Publish talipot-sip wheel to TestPyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          twine check wheelhouse/*
          twine upload --skip-existing wheelhouse/*
